name: Beyond Facts Scheduled Post Runner

on:
  schedule:
    # Runs every hour at minute 0 to ensure all timezones and 2-hour slots are precisely checked
    - cron: '0 * * * *'

  workflow_dispatch:
    inputs:
      force_slot:
        description: 'Force run a specific slot (e.g. 08:00, 10:00, 12:00, 14:00, 16:00, 18:00, 20:00, 22:00) or leave blank for automatic schedule check'
        required: false
        default: ''

jobs:
  run-scheduled-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Execute Schedule Check & Post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ID: ${{ secrets.INSTAGRAM_BUSINESS_ID }}
        run: |
          if [ -n "${{ github.event.inputs.force_slot }}" ]; then
            echo "Force running slot: ${{ github.event.inputs.force_slot }}"
            python scheduler.py --force "${{ github.event.inputs.force_slot }}"
          else
            echo "Running automatic schedule check..."
            python scheduler.py --check
          fi

      - name: Commit & Push Updated History Database
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add history.db
          git diff --quiet && git diff --staged --quiet || git commit -m "update: sync history.db after scheduled post run"
          git push
